name: Publish release
description: Tag, build, and publish a release or release-candidate on PR merge.

on:
  pull_request_target:
    branches:
      - master
      - release
    types:
      - closed
    paths:
      - wool/src/**
      - wool/pyproject.toml
  workflow_dispatch:
    inputs:
      version:
        type: string

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  bump-version:
    name: Bump version
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.merged == true || github.event.inputs.version != '' }}
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump-version.outputs.version }}
    steps:
      # No `ref:` here, for the reason spelled out in `tag-version` below.
      # `fetch-depth: 0` gives the tag history `git describe` walks; the
      # merge commit itself is fetched explicitly in the bump step, since
      # `github.sha` under `pull_request_target` is only documented as the
      # last commit on the base branch, not as the merge commit.
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/get-wool-labs-app-token
        id: get-wool-labs-app-token
        with:
          app-id: ${{ secrets.WOOL_LABS_APP_ID }}
          app-installation-id: ${{ secrets.WOOL_LABS_INSTALLATION_ID }}
          app-private-key: ${{ secrets.WOOL_LABS_PRIVATE_KEY }}
      - name: Determine version segment to bump
        id: determine-version-segment
        if: ${{ github.event.inputs.version == '' }}
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          .github/scripts/version-segment.sh "$BASE_REF" "$HEAD_REF" >> $GITHUB_OUTPUT
      - name: Bump version
        id: bump-version
        env:
          GH_TOKEN: ${{ steps.get-wool-labs-app-token.outputs.access-token }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          VERSION_SEGMENT: ${{ steps.determine-version-segment.outputs.segment }}
          VERSION_CHANNEL: ${{ steps.determine-version-segment.outputs.channel }}
        run: |
          git config --local --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if [[ "$INPUT_VERSION" != "" ]]; then
            new_version="$INPUT_VERSION"
            echo "Using manually specified version: $new_version"
          else
            # The version is read from the lineage of the commit that
            # `tag-version` tags, so the tag it lands beside is the tag it
            # was derived from. Falling back to the base branch tip covers
            # a merge commit the API did not report.
            git fetch --tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            describe_ref="$MERGE_SHA"
            if ! git cat-file -e "${describe_ref}^{commit}" 2>/dev/null; then
              describe_ref="origin/${BASE_REF}"
            fi
            old_version=$(.github/scripts/latest-version.sh "$VERSION_CHANNEL" "$describe_ref")
            new_version=$(.github/scripts/bump-version.sh "$VERSION_SEGMENT" "$old_version")
            echo "Bumping $old_version to $new_version"
          fi
          echo "version=$new_version" >> $GITHUB_OUTPUT

  tag-version:
    name: Tag version
    needs: bump-version
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.merged == true || github.event.inputs.version != '' }}
    permissions:
      contents: write
    steps:
      # No `ref:` here. Under `pull_request_target` on a fork PR,
      # actions/checkout refuses any PR-associated ref (see
      # allow-unsafe-pr-checkout). The base branch is trusted and is all
      # this job needs: the composite action below runs from the checked
      # out tree, and the tag is created through the API at TARGET_SHA.
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/get-wool-labs-app-token
        id: get-wool-labs-app-token
        with:
          app-id: ${{ secrets.WOOL_LABS_APP_ID }}
          app-installation-id: ${{ secrets.WOOL_LABS_INSTALLATION_ID }}
          app-private-key: ${{ secrets.WOOL_LABS_PRIVATE_KEY }}
      - name: Create tag
        id: create-tag
        env:
          GH_TOKEN: ${{ steps.get-wool-labs-app-token.outputs.access-token }}
          REPO: ${{ github.repository }}
          NEW_VERSION: ${{ needs.bump-version.outputs.version }}
          TARGET_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          echo "Tagging $NEW_VERSION at $TARGET_SHA"
          gh api "repos/$REPO/git/refs" \
            -f ref="refs/tags/$NEW_VERSION" \
            -f sha="$TARGET_SHA"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

  build-release:
    name: Build release
    needs:
      - bump-version
      - tag-version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        source: [wool]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/build-release
        with:
          source: ${{ matrix.source }}
          version: ${{ needs.bump-version.outputs.version }}

  create-github-release:
    name: Create GitHub release
    needs:
      - bump-version
      - tag-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.bump-version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          if [[ "$VERSION" == *rc* ]]; then
            prerelease_flag="--prerelease"
          else
            prerelease_flag=""
          fi
          gh release create "$VERSION" \
            --repo "$REPO" \
            --generate-notes \
            $prerelease_flag

  publish-github-release:
    name: Publish release to GitHub
    needs:
      - bump-version
      - tag-version
      - build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    strategy:
      matrix:
        source: [wool]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/publish-github-release
        with:
          source: ${{ matrix.source }}
          version: ${{ needs.bump-version.outputs.version }}

  publish-pypi-release:
    name: Publish release to PyPI
    needs:
      - bump-version
      - tag-version
      - build-release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    strategy:
      matrix:
        source: [wool]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/publish-pypi-release
        with:
          source: ${{ matrix.source }}
          version: ${{ needs.bump-version.outputs.version }}
          pypi-token: ${{ secrets.PYPI_TOKEN }}

  drop-release:
    name: Drop release
    needs:
      - build-release
      - create-github-release
      - publish-github-release
      - publish-pypi-release
    runs-on: ubuntu-latest
    if: |
      always() &&
      github.event.pull_request.merged == true &&
      github.head_ref == 'release' &&
      github.base_ref == 'master' &&
      !contains(needs.*.result, 'failure')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/get-wool-labs-app-token
        id: get-wool-labs-app-token
        with:
          app-id: ${{ secrets.WOOL_LABS_APP_ID }}
          app-installation-id: ${{ secrets.WOOL_LABS_INSTALLATION_ID }}
          app-private-key: ${{ secrets.WOOL_LABS_PRIVATE_KEY }}
      - name: Drop release branch
        env:
          GH_TOKEN: ${{ steps.get-wool-labs-app-token.outputs.access-token }}
          REPO: ${{ github.repository }}
        run: |
          git config --local --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git fetch --unshallow
          if [[ -n $(git ls-remote --heads origin release) ]]; then
            git push origin --delete release
          else
            echo "Release branch not found, skipping."
          fi
